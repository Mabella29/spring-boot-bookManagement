server.port=8080
# Initialize schema
spring.sql.init.mode=always

spring.r2dbc.url=${DB_URL}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

jwt.secret=${SECRET}
jwt.expiration=86400000



spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30000

logging.level.io.r2dbc.postgresql=INFO
logging.level.org.springframework.r2dbc.core=DEBUG
logging.level.reactor.core.publisher=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Logging configuration
logging.level.root=INFO
logging.level.com.mtn=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Netty configuration
server.netty.max-initial-line-length=4096



springdoc.api-docs.path=/api-docs

app.cors.allowed-origins=*


