server.port=8080
# Initialize schema
spring.sql.init.mode=always

spring.r2dbc.url=${DB_URL}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

jwt.secret=${SECRET}
jwt.expiration=86400000



spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30000

logging.level.io.r2dbc.postgresql=INFO
logging.level.org.springframework.r2dbc.core=DEBUG
logging.level.reactor.core.publisher=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Logging configuration
logging.level.root=INFO
logging.level.com.mtn=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Netty configuration
server.netty.max-initial-line-length=4096

springdoc.api-docs.path=/v3/api-docs

# CORS Config
cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Authorization,Content-Type
cors.allow-credentials=true
cors.max-age=3600
cors.path-pattern=/**

# Cloudinary configuration
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET_KEY}

# pay stack config
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.base-url=https://api.paystack.co